wireplumber.rules = [
  # Prevent WirePlumber from restoring a saved per-stream target for Sober.
  # Without this, Sober sticks to whatever source it last used (often b2_mic).
  {
    matches = [
      {
        node.name = "Sober"
        media.class = "Stream/Input/Audio"
      }
    ]
    apply-properties = {
      state.restore-target = false
    }
  }

  # Give b1_mic a high session priority so WirePlumber picks it as the default
  # audio source instead of b2_mic (which is created after b1_mic and would
  # otherwise win by recency).
  {
    matches = [
      { node.name = "b1_mic" }
    ]
    apply-properties = {
      priority.session = 2010
    }
  }

  # Keep b2_mic at a lower priority so it doesn't silently become the default.
  {
    matches = [
      { node.name = "b2_mic" }
    ]
    apply-properties = {
      priority.session = 1000
    }
  }
]

# Load the Lua hook that forces Sober capture streams to b1_mic by writing
# target.object into the default metadata, which find-defined-target.lua reads.
wireplumber.components = [
  {
    name = sober-mic-target.lua, type = script/lua
    provides = hooks.custom.sober-mic-target
  }
]

wireplumber.profiles = {
  main = {
    hooks.custom.sober-mic-target = required
  }
}
