# 48 kHz graph, restart-safe Scarlett -> Carla microphone baseline.
# Sustained live testing found 256 frames can xrun; 512 frames is stable.
# The sender can retry 256 after ten clean minutes and automatically step back.
# Keep resampler quality high for SRC; this profile changes timing only.
context.properties = {
    default.clock.rate          = 48000
    default.clock.allowed-rates = [ 48000 ]
    default.clock.quantum       = 512
    default.clock.min-quantum   = 256
    default.clock.max-quantum   = 1024
    resample.quality            = 10
}
